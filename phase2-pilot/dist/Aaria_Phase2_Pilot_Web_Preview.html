*,*::before,*::after{box-sizing:border-box}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #6b56bd;outline-offset:3px}

:root {
  color-scheme: light;
  --cream:#fff8ee; --cream-deep:#faecdb; --sage:#8ca68b; --sage-deep:#66836b;
  --pink:#f8cbd4; --coral:#ef6d7d; --lavender:#b7a5e6; --brown:#886b5b;
  --blue:#d7e9ff; --yellow:#fff0b2; --gold:#f4c542; --ink:#282b2f;
  --muted:#666773; --white:#fff; --line:#eadfd5; --shadow:0 10px 26px #69503a18;
  --radius-xl:28px; --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  --font-display:Georgia,'Times New Roman',serif;
  --font-ui:ui-rounded,'Avenir Next',Avenir,system-ui,-apple-system,sans-serif;
}

<script type="module">export function parseHash(hash, allowedRoutes) {
  const [name='home',id='']=hash.replace(/^#\/?/,'').split('/');
  return allowedRoutes.has(name)?{name,id}:{name:'home',id:''};
}

const nutritionKeys = ['kcal','proteinG','carbohydrateG','totalFatG','saturatedFatG','fiberG','sugarG','sodiumMg'];
export function validateRecipe(recipe) {
  const errors=[];
  for (const key of ['id','title','servings','ingredients','equipment','allergens','adultHelp','steps','nutrition','artworkIds','publicationStatus','estimatedHandsOnMinutes','durationStatus']) {
    if (recipe[key] == null || recipe[key] === '') errors.push(`Missing ${key}`);
  }
  if (recipe.servings < 1) errors.push('Servings must be positive');
  if (!recipe.steps?.length) errors.push('At least one step is required');
  if (recipe.steps?.some(s => !s.title || !s.instruction || !s.safety || !s.art)) errors.push('Each step needs instruction, safety and artwork mapping');
  for (const key of nutritionKeys) if (!(recipe.nutrition?.perServing && key in recipe.nutrition.perServing)) errors.push(`Nutrition field missing: ${key}`);
  return errors;
}
export function nutritionIsVerified(recipe) {
  return nutritionKeys.every(key => Number.isFinite(recipe.nutrition?.perServing?.[key])) && recipe.nutrition?.verificationStatus?.startsWith('VERIFIED');
}
export function matchRecipes(catalog, pantryIds) {
  const pantry=new Set(pantryIds);
  return catalog.recipes.filter(r => r.ingredients.filter(i=>!i.optional).every(i=>pantry.has(i.id)));
}

const state={catalog:null,route:{name:'home'},selected:{},step:0,adultAcknowledged:false,pantry:new Set(),recipeFilter:'all',query:''};
const characters=[['Aaria','Curious, creative and loves to cook!','aaria'],['Mommy','Supportive, kind and always there with a smile.','mommy'],['Daddy','Encourages Aaria’s dreams and loves trying new recipes together.','daddy'],['Sophia','Creative and adventurous; loves to experiment.','sophia'],['Liam','Kind, curious and always up for a cooking challenge!','liam'],['Emma','Fun, positive and loves making delicious treats!','emma'],['Friends','Pets and friends make cooking even more fun.','friends']];
const saved=()=>{try{return JSON.parse(localStorage.getItem('aaria.creations')||'[]')}catch{return []}};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function recipe(id){return state.catalog.recipes.find(r=>r.id===id)}
function selectedFor(r){return state.selected[r.id]||r.ingredients.map(i=>i.id)}
function recipePhoto(id){return recipePhotos[id]||''}
function selectedIngredientChips(r,selected){const chosen=r.ingredients.filter(i=>selected.includes(i.id));return chosen.length?chosen.map(i=>`<span class="selected-chip">${escapeHtml(i.name)}</span>`).join(''):'<span class="selected-chip muted">Choose ingredients to build your mix</span>'}
function moneyless(n,unit=''){return n==null?'Not verified':`${n}${unit}`}
function nav(name,id=''){location.hash=`#/${name}${id?`/${id}`:''}`}
function tile(r){return `<article class="recipe-card"><button class="recipe-open" data-open="${r.id}" aria-label="Open ${escapeHtml(r.title)}"><div class="dish-art ${r.id}"><img class="dish-photo" src="${recipePhoto(r.id)}" alt="Finished ${escapeHtml(r.title)}"><span class="dish-tag">Approx. ${r.estimatedHandsOnMinutes} min prep · ${escapeHtml(r.difficulty)}</span></div><div class="recipe-card-copy"><span class="eyebrow">${escapeHtml(r.category)}</span><h3>${escapeHtml(r.title)}</h3><p>${escapeHtml(r.description)}</p><span class="text-link">See recipe <b>↗</b></span></div></button></article>`}
function layout(body,title='') {document.title=title?`${title} · Aaria's Magical Kitchen`:"Aaria's Magical Kitchen";main.innerHTML=body;}
