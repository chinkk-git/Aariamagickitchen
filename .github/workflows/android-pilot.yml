name: Aaria Phase 2 debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/platform-v2
    paths:
      - 'phase2-pilot/apps/aaria-kitchen/**'
      - 'phase2-pilot/apps/aaria-android/**'
      - 'phase2-pilot/domains/cooking/**'
      - 'phase2-pilot/packages/**'
      - 'phase2-pilot/tools/build/**'
      - 'phase2-pilot/tools/artwork-verifier/**'
      - 'phase2-pilot/tools/recipe-validator/**'
      - 'phase2-pilot/tests/**'
      - 'phase2-pilot/package.json'
      - 'phase2-pilot/package-lock.json'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Run pilot checks
        working-directory: phase2-pilot
        run: |
          npm test
          npm run validate:recipes
          npm run validate:artwork
          npm run build:preview
          node --check apps/aaria-kitchen/app.js
          node --check dist/bundle-check.mjs

      - name: Install standalone pilot preview into Android shell
        run: mkdir -p phase2-pilot/apps/aaria-android/app/src/main/assets && cp phase2-pilot/dist/Aaria_Phase2_Pilot_Web_Preview.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
      - name: Assemble debug APK
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aaria-phase2-pilot-debug-apk
          path: phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

