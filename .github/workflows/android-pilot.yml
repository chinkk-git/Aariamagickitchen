name: Aaria Phase 2 debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/platform-v2
    paths:
      - 'phase2-pilot/**'
      - '.github/workflows/android-pilot.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Run pilot checks
        working-directory: phase2-pilot
        run: |
          npm test
          npm run validate:recipes
          npm run validate:artwork
          npm run build:preview
          node --check apps/aaria-kitchen/app.js
          node --check dist/bundle-check.mjs

      - name: Install standalone web pilot in Android shell
        working-directory: phase2-pilot
        run: |
          mkdir -p apps/aaria-android/app/src/main/assets
          cp dist/Aaria_Phase2_Pilot_Web_Preview.html apps/aar