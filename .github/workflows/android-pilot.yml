name: Aaria V3 Android APK and HTML

on:
  workflow_dispatch:
  push:
    branches:
      - feature/platform-v3
      - codex/v3-webview-hardening-20261017
      - codex/v3-completion-core-20261017
    paths:
      - 'index.html'
      - '.github/workflows/android-pilot.yml'
      - 'phase2-pilot/apps/aaria-android/**'
      - 'tools/v3/**'

permissions:
  contents: read

jobs:
  build-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V3 app source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build V3 HTML from production and validate all recipes
        run: |
          node --check tools/v3/transform-production.mjs
          node tools/v3/transform-production.mjs index.html dist/Aaria_Magical_Kitchen_V3.html
          node tools/v3/validate-v3.mjs dist/Aaria_Magical_Kitchen_V3.html
          node tools/v3/test-approved-chef-art.mjs dist/Aaria_Magical_Kitchen_V3.html

      - name: Validate Android adapters
        run: |
          node --check tools/v3/runtime.js
          node tools/v3/test-csp-policy.mjs
          node tools/v3/test-profile-isolation.mjs
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/avatar-adapter.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/quiz-adapter.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/mobile-fixes.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/share-polyfill.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/grocery-whatsapp.js

      - name: Package V3 HTML into offline Android assets
        run: |
          mkdir -p phase2-pilot/apps/aaria-android/app/src/main/assets
          cp dist/Aaria_Magical_Kitchen_V3.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          sha256sum dist/Aaria_Magical_Kitchen_V3.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html

      - name: Test WebView asset origin policy
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android testDebugUnitTest

      - name: Build a lower-version same-signer upgrade fixture
        shell: bash
        run: |
          set -euo pipefail
          gradle_file="phase2-pilot/apps/aaria-android/app/build.gradle.kts"
          backup="$RUNNER_TEMP/v3-app-build.gradle.kts"
          cp "$gradle_file" "$backup"
          key_dir="$RUNNER_TEMP/v3-ci-debug-key"
          mkdir -p "$key_dir"
          keytool -genkeypair -noprompt -keystore "$key_dir/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=V3 CI Debug,O=Aaria,C=US"
          export V3_CI_DEBUG_KEYSTORE="$key_dir/debug.keystore"
          echo "V3_CI_DEBUG_KEYSTORE=$key_dir/debug.keystore" >> "$GITHUB_ENV"
          python3 - "$gradle_file" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          if source.count("versionCode = 7") != 1 or source.count("    signingConfigs {") != 1:
              raise SystemExit("Expected the V3 versionCode and signingConfigs blocks")
          test_signing = '''    signingConfigs {
                  getByName("debug") {
                      storeFile = file(System.getenv("V3_CI_DEBUG_KEYSTORE"))
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
          '''
          source = source.replace("    signingConfigs {", test_signing, 1)
          path.write_text(source.replace("versionCode = 7", "versionCode = 6"))
          PY
          gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleDebug
          mkdir -p "$RUNNER_TEMP/v3-upgrade-fixture"
          cp phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/v3-upgrade-fixture/app-debug-v6.apk"
          python3 - "$gradle_file" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          if source.count("versionCode = 6") != 1:
              raise SystemExit("Expected exactly one lower-version fixture value")
          path.write_text(source.replace("versionCode = 6", "versionCode = 7"))
          PY

      - name: Assemble installable APK
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android clean assembleDebug
      - name: Restore production Android build configuration
        run: cp "$RUNNER_TEMP/v3-app-build.gradle.kts" phase2-pilot/apps/aaria-android/app/build.gradle.kts
      - name: Install and launch APK in Android emulator
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/aaria-emulator-diagnostics"
          mkdir -p "$diagnostics"
          image="system-images;android-35;google_apis;x86_64"
          sdkmanager --install "$image"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          # Avoid --device here: hosted SDK images may omit the device catalog,
          # which can leave avdmanager without creating the named AVD.
          printf 'no\n' | avdmanager create avd --force -n aaria-v3-ci -k "$image"
          if [[ ! -s "$ANDROID_AVD_HOME/aaria-v3-ci.ini" ]]; then
            avdmanager list avd
            echo "::error::avdmanager did not create the expected AVD."
            exit 1
          fi
          echo "::group::Runner and emulator diagnostics"
          free -h | tee "$diagnostics/memory.txt"
          nproc | tee "$diagnostics/cpu-count.txt"
          id | tee "$diagnostics/identity.txt"
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::KVM device is unavailable on this runner."
            exit 1
          fi
          ls -l /dev/kvm | tee "$diagnostics/kvm-before.txt"
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          ls -l /dev/kvm | tee "$diagnostics/kvm-after.txt"
          if ! "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee "$diagnostics/kvm-accel-check.txt"; then
            echo "::error::Runner user still cannot use KVM after the scoped device permission fix."
            exit 1
          fi
          avdmanager list avd
          cat "$ANDROID_AVD_HOME/aaria-v3-ci.ini" | tee "$diagnostics/avd.ini"
          cat "$ANDROID_AVD_HOME/aaria-v3-ci.avd/config.ini" | tee "$diagnostics/avd-config.ini"
          echo "::endgroup::"
          adb version | tee "$diagnostics/adb-version.txt"
          adb devices -l | tee "$diagnostics/adb-before.txt"
          "$ANDROID_HOME/emulator/emulator" -verbose -avd aaria-v3-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data >"$diagnostics/emulator-boot.log" 2>&1 &
          emulator_pid=$!
          if ! timeout 300 adb wait-for-device; then
            cat "$diagnostics/emulator-boot.log"
            adb devices -l
            echo "::error::Android emulator did not expose an ADB device within 5 minutes."
            exit 1
          fi
          if ! kill -0 "$emulator_pid" 2>/dev/null; then
            cat "$diagnostics/emulator-boot.log"
            echo "::error::Android emulator exited before ADB became available."
            exit 1
          fi
          booted=0
          for attempt in $(seq 1 60); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then booted=1; break; fi
            sleep 5
          done
          if [[ "$booted" != "1" ]]; then
            cat "$diagnostics/emulator-boot.log"
            echo "::error::Android emulator did not finish booting."
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices -l | tee "$diagnostics/adb-ready.txt"
          adb shell getprop | tee "$diagnostics/boot-properties.txt"
          apk="phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk"
          upgrade_apk="$RUNNER_TEMP/v3-upgrade-fixture/app-debug-v6.apk"
          package="com.aaria.magickitchen.pilot"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          fixture_signer="$("$apksigner" verify --print-certs "$upgrade_apk" 2>&1 | sed -nE 's/^[[:space:]]*Signer #1 certificate SHA-256 digest: *//p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          current_signer="$("$apksigner" verify --print-certs "$apk" 2>&1 | sed -nE 's/^[[:space:]]*Signer #1 certificate SHA-256 digest: *//p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$fixture_signer" || "$fixture_signer" != "$current_signer" ]]; then
            echo "::error::Lower-version upgrade fixture and current debug APK do not share a signer."
            exit 1
          fi
          printf 'fixture_version_code=6\ncurrent_version_code=7\nshared_debug_signer_sha256=%s\n' "$fixture_signer" | tee "$diagnostics/upgrade-signing.txt"
          adb install "$upgrade_apk" | tee "$diagnostics/upgrade-fixture-install.txt"
          old_version="$(adb shell dumpsys package "$package" | grep -m1 'versionCode=')"
          printf '%s\n' "$old_version" | tee "$diagnostics/upgrade-version-before.txt"
          if [[ "$old_version" != *"versionCode=6"* ]]; then
            echo "::error::Installed upgrade fixture does not report versionCode 6."
            exit 1
          fi
          profile_fixture="$RUNNER_TEMP/v3-upgrade-profile.db"
          python3 - "$profile_fixture" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          db.executescript("""
          PRAGMA user_version=1;
          CREATE TABLE profiles (id TEXT PRIMARY KEY NOT NULL, name TEXT NOT NULL, chef_id TEXT NOT NULL, created_at INTEGER NOT NULL);
          CREATE TABLE profile_state (profile_id TEXT PRIMARY KEY NOT NULL REFERENCES profiles(id) ON DELETE CASCADE, snapshot TEXT NOT NULL, updated_at INTEGER NOT NULL);
          CREATE TABLE app_meta (key TEXT PRIMARY KEY NOT NULL, value TEXT NOT NULL);
          """)
          db.execute("INSERT INTO profiles VALUES (?,?,?,?)", ("upgrade-profile", "Aaria", "CHEF_A", 1))
          db.execute("INSERT INTO profile_state VALUES (?,?,?)", ("upgrade-profile", '{"favorites":["upgrade-favorite"],"done":[1,95],"weeks":{"week-1":{"day-1":true}}}', 1))
          db.executemany("INSERT INTO app_meta VALUES (?,?)", [("legacy_v4_migration_complete", "1"), ("active_profile_id", "upgrade-profile")])
          db.commit()
          db.close()
          PY
          adb shell run-as "$package" mkdir -p databases
          adb push "$profile_fixture" /data/local/tmp/aaria-v3-upgrade-profile.db
          adb shell run-as "$package" cp /data/local/tmp/aaria-v3-upgrade-profile.db databases/my_magical_kitchen_v3.db
          adb shell run-as "$package" chmod 600 databases/my_magical_kitchen_v3.db
          adb shell am start -W -n "$package/.MainActivity" | tee "$diagnostics/upgrade-fixture-launch.txt"
          if ! grep -Fq "Status: ok" "$diagnostics/upgrade-fixture-launch.txt"; then
            echo "::error::Lower-version upgrade fixture failed to start."
            exit 1
          fi
          adb shell am force-stop "$package"
          adb exec-out run-as "$package" cat databases/my_magical_kitchen_v3.db > "$diagnostics/profile-before-upgrade.db"
          python3 - "$diagnostics/profile-before-upgrade.db" <<'PY'
          import json, sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          row = db.execute("SELECT snapshot FROM profile_state WHERE profile_id='upgrade-profile'").fetchone()
          assert row is not None, "pre-upgrade profile missing"
          state = json.loads(row[0])
          assert state["favorites"] == ["upgrade-favorite"] and state["done"] == [1, 95], "pre-upgrade state mismatch"
          PY
          adb install -r "$apk" | tee "$diagnostics/current-apk-upgrade-install.txt"
          new_version="$(adb shell dumpsys package "$package" | grep -m1 'versionCode=')"
          printf '%s\n' "$new_version" | tee "$diagnostics/upgrade-version-after.txt"
          if [[ "$new_version" != *"versionCode=7"* ]]; then
            echo "::error::APK upgrade did not advance the installed app to versionCode 7."
            exit 1
          fi
          adb shell am start -W -n "$package/.MainActivity" | tee "$diagnostics/upgraded-app-launch.txt"
          if ! grep -Fq "Status: ok" "$diagnostics/upgraded-app-launch.txt"; then
            echo "::error::Upgraded V3 APK failed to start."
            exit 1
          fi
          adb shell am force-stop "$package"
          adb exec-out run-as "$package" cat databases/my_magical_kitchen_v3.db > "$diagnostics/profile-after-upgrade.db"
          python3 - "$diagnostics/profile-after-upgrade.db" <<'PY'
          import json, sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          row = db.execute("SELECT snapshot FROM profile_state WHERE profile_id='upgrade-profile'").fetchone()
          assert row is not None, "profile missing after APK upgrade"
          state = json.loads(row[0])
          assert state["favorites"] == ["upgrade-favorite"] and state["done"] == [1, 95], "favorites/progress changed after APK upgrade"
          assert state["weeks"]["week-1"]["day-1"] is True, "weekly progress changed after APK upgrade"
          print("Same-signer debug APK upgrade v6→v7 preserved favorites, completed recipe IDs and weekly progress.")
          PY
          adb uninstall "$package"
          adb install -r "$apk"
          adb logcat -c
          adb shell am start -W -n "$package/.MainActivity"
          pid="$(adb shell pidof -s "$package" | tr -d '\r')"
          if [[ -z "$pid" ]]; then
            adb logcat -d
            echo "::error::V3 app process did not remain alive after launch."
            exit 1
          fi
          if adb logcat -d -s AndroidRuntime:E | grep -Fq "FATAL EXCEPTION"; then
            adb logcat -d -s AndroidRuntime:E
            echo "::error::V3 app crashed during emulator startup."
            exit 1
          fi
          adb shell pidof -s com.aaria.magickitchen.pilot | tee "$diagnostics/app-pid.txt"
          adb logcat -d -s AndroidRuntime:E | tee "$diagnostics/android-runtime-errors.txt"
          adb shell settings put system accelerometer_rotation 0
          for rotation in 0 1; do
            adb shell settings put system user_rotation "$rotation"
            sleep 2
            orientation_pid="$(adb shell pidof -s "$package" | tr -d '\r')"
            if [[ -z "$orientation_pid" ]]; then
              adb logcat -d
              echo "::error::V3 app process did not survive orientation change $rotation."
              exit 1
            fi
          done
          adb shell settings put system user_rotation 0
          adb shell pidof -s "$package" | tee "$diagnostics/orientation-pid.txt"

          adb shell input keyevent KEYCODE_BACK
          back_exited=0
          for attempt in $(seq 1 10); do
            resumed="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true)"
            if [[ -n "$resumed" && "$resumed" != *"$package"* ]]; then back_exited=1; break; fi
            sleep 1
          done
          printf '%s\n' "$resumed" | tee "$diagnostics/back-navigation.txt"
          if [[ "$back_exited" != "1" ]]; then
            echo "::error::Android Back did not exit the V3 home activity."
            exit 1
          fi

          adb shell cmd connectivity airplane-mode enable | tee "$diagnostics/airplane-mode-command.txt"
          airplane_mode="$(adb shell settings get global airplane_mode_on | tr -d '\r')"
          printf 'airplane_mode=%s\n' "$airplane_mode" | tee "$diagnostics/offline-state.txt"
          if [[ "$airplane_mode" != "1" ]]; then
            echo "::error::Emulator did not enter airplane mode for offline startup test."
            exit 1
          fi
          adb shell am force-stop "$package"
          sleep 1
          stopped_pid="$(adb shell pidof -s "$package" | tr -d '\r' || true)"
          if [[ -n "$stopped_pid" ]]; then
            echo "::error::V3 app process remained active after force-stop before offline cold launch."
            exit 1
          fi
          adb shell am start -W -n com.aaria.magickitchen.pilot/.MainActivity | tee "$diagnostics/offline-launch.txt"
          if ! grep -Fq "LaunchState: COLD" "$diagnostics/offline-launch.txt"; then
            echo "::error::Offline APK launch was not a cold process start."
            exit 1
          fi
          offline_pid=""
          for attempt in $(seq 1 30); do
            offline_pid="$(adb shell pidof -s "$package" | tr -d '\r' || true)"
            if [[ -n "$offline_pid" ]]; then break; fi
            sleep 1
          done
          if [[ -z "$offline_pid" ]]; then
            adb logcat -d
            echo "::error::V3 app did not remain alive after offline startup."
            exit 1
          fi
          if adb logcat -d -s AndroidRuntime:E | grep -Fq "FATAL EXCEPTION"; then
            adb logcat -d -s AndroidRuntime:E
            echo "::error::V3 app crashed during offline startup."
            exit 1
          fi
          printf '%s\n' "$offline_pid" | tee "$diagnostics/offline-app-pid.txt"
          adb logcat -d -s AndroidRuntime:E | tee "$diagnostics/android-runtime-errors.txt"

      - name: Verify unsigned release builds are refused
        shell: bash
        run: |
          set +e
          gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleRelease > "$RUNNER_TEMP/release-signing-guard.log" 2>&1
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            echo "::error::assembleRelease unexpectedly succeeded without trusted signing inputs."
            exit 1
          fi
          if ! grep -Fq "Refusing to build an unsigned release APK; configure the existing trusted signing key." "$RUNNER_TEMP/release-signing-guard.log"; then
            cat "$RUNNER_TEMP/release-signing-guard.log"
            echo "::error::assembleRelease failed for a reason other than the expected signing guard."
            exit 1
          fi


      - name: Upload Android emulator boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-v3-emulator-diagnostics
          path: ${{ runner.temp }}/aaria-emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload installable V3 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3-apk
          path: phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload replaceable V3 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3-html
          path: dist/Aaria_Magical_Kitchen_V3.html
          if-no-files-found: error
          retention-days: 30
