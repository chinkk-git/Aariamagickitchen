name: Aaria production Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/platform-v2
    paths:
      - 'index.html'
      - '.github/workflows/android-pilot.yml'
      - 'phase2-pilot/apps/aaria-android/**'

permissions:
  contents: read

jobs:
  build-production-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Validate production catalog and app adapters
        run: |
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/avatar-adapter.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/quiz-adapter.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/mobile-fixes.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/share-polyfill.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/grocery-whatsapp.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/(?:const|let)\s+RECIPES\s*=\s*/);
          if (!match) throw new Error('Recipe catalog not found in production index.html');
          const start = match.index + match[0].length;
          if (html[start] !== '[') throw new Error('Recipe catalog is not an array');
          let depth = 0, quote = '', escaped = false, end = -1;
          for (let i = start; i < html.length; i++) {
            const c = html[i];
            if (quote) {
              if (escaped) escaped = false;
              else if (c === '\\') escaped = true;
              else if (c === quote) quote = '';
              continue;
            }
            if (c === '"' || c === "'" || c === '`') { quote = c; continue; }
            if (c === '[') depth++;
            else if (c === ']' && --depth === 0) { end = i + 1; break; }
          }
          if (end < 0) throw new Error('Could not parse recipe catalog');
          const recipes = vm.runInNewContext('(' + html.slice(start, end) + ')');
          const ids = new Set(recipes.map(r => Number(r.id)));
          const artwork = (html.match(/data:image\//g) || []).length;
          if (recipes.length !== 95 || ids.size !== 95) {
            throw new Error(`Expected 95 unique recipes, found ${recipes.length} recipes / ${ids.size} IDs`);
          }
          if (artwork < 100) throw new Error(`Expected embedded production artwork; found only ${artwork} data images`);
          console.log(`Production catalog verified: ${recipes.length} recipes, ${artwork} embedded artwork references.`);
          NODE

      - name: Package production index.html into offline Android assets
        run: |
          mkdir -p phase2-pilot/apps/aaria-android/app/src/main/assets
          cp index.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          sha256sum index.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html

      - name: Assemble installable APK
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleDebug

      - name: Upload installable production APK
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-production-apk
          path: phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
