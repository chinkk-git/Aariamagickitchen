name: Aaria V3 Android APK and HTML

on:
  workflow_dispatch:
  push:
    branches:
      - feature/platform-v3
      - codex/v3-webview-hardening-20261017
      - codex/v3-completion-core-20261017
      - feature/w01-97-recipe-mainline
      - feature/v3.5-recipe-expansion
    paths:
      - 'index.html'
      - '.github/workflows/android-pilot.yml'
      - 'phase2-pilot/apps/aaria-android/**'
      - 'tools/v3/**'
      - 'content/international/**'

concurrency:
  # Serialize identical source commits. The dedupe job below skips a second build after the first run finishes.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deduplicate:
    if: github.ref_name != 'feature/w01-97-recipe-mainline'
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
    steps:
      - name: Prevent duplicate builds for the same source commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          previous_runs="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&per_page=100" \\
            --jq ".workflow_runs[] | select(.id != ${CURRENT_RUN_ID} and .path == \\\".github/workflows/android-pilot.yml\\\") | .id" || true)"
          if [[ -n "${previous_runs//[    runs-on: ubuntu-latest
    steps:
      - name: Check out V3 app source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Stage V3.5 international review recipes
        if: github.ref == 'refs/heads/feature/v3.5-recipe-expansion'
        run: |
          set -euo pipefail
          echo "V35_RECIPE_REVIEW_BUILD_SUFFIX=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          node --check tools/v3/artwork/build-v35-international-review.mjs
          node tools/v3/artwork/build-v35-international-review.mjs

      - name: Build V3 HTML from production and validate all recipes
        run: |
          node --check tools/v3/transform-production.mjs
          node tools/v3/transform-production.mjs index.html dist/Aaria_Magical_Kitchen_V3.html
          if [[ "$GITHUB_REF_NAME" == 'feature/v3.5-recipe-expansion' ]]; then
            node tools/v3/validate-v35-international-review.mjs
            node tools/v3/validate-v35-country-navigation.mjs
            node tools/v3/create-v35-acceptance-report.mjs artifacts/v35-acceptance-report.json
          fi
          node tools/v3/validate-v3.mjs dist/Aaria_Magical_Kitchen_V3.html
          node tools/v3/test-approved-chef-art.mjs dist/Aaria_Magical_Kitchen_V3.html

      - name: Validate Android adapters
        run: |
          node --check tools/v3/runtime.js
          node tools/v3/test-csp-policy.mjs
          node tools/v3/test-profile-isolation.mjs
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/avatar-adapter.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/quiz-adapter.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/mobile-fixes.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/share-polyfill.js
          node --check phase2-pilot/apps/aaria-android/app/src/main/assets/grocery-whatsapp.js

      - name: Package V3 HTML into offline Android assets
        run: |
          mkdir -p phase2-pilot/apps/aaria-android/app/src/main/assets
          node --check tools/v3/android-externalize-data-uris.mjs
          node tools/v3/android-externalize-data-uris.mjs dist/Aaria_Magical_Kitchen_V3.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html phase2-pilot/apps/aaria-android/app/src/main/assets/android-inline-art
          test -s phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          mkdir -p artifacts
          cp phase2-pilot/apps/aaria-android/app/src/main/assets/android-inline-art/asset-manifest.json artifacts/v35-artwork-manifest.json
          sha256sum dist/Aaria_Magical_Kitchen_V3.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html

      - name: Test WebView asset origin policy
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android testDebugUnitTest

      - name: Assemble installable APK
        id: assemble_apk
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleDebug

      - name: Verify Android launch, WebView and essential routes
        if: github.ref == 'refs/heads/feature/v3.5-recipe-expansion'
        timeout-minutes: 15
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          # Software rendering avoids SwiftShader color-buffer and package-service crashes on no-KVM hosted runners.
          emulator-options: -no-window -gpu off -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 4096
          disable-animations: true
          script: |
            bash tools/v3/run-v35-android-smoke.sh

      - name: Verify APK and record source/artifact hashes
        if: always() && steps.assemble_apk.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          apk=phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$aapt" dump badging "$apk" > apk-badging.txt
          "$apksigner" verify --print-certs "$apk" > apk-signer.txt
          sha256sum "$apk" > apk-sha256.txt
          {
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/package_id=\1\nversion_code=\2\nversion_name=\3/p" apk-badging.txt | head -n 3
            cat apk-sha256.txt
            sed -n 's/.*certificate SHA-256 digest: /debug_signer_certificate_sha256=/p' apk-signer.txt | head -n 1
          } | tee v35-review-build-metadata.txt
      - name: Verify unsigned release builds are refused
        if: always() && steps.assemble_apk.outcome == 'success'
        shell: bash
        run: |
          set +e
          gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleRelease > "$RUNNER_TEMP/release-signing-guard.log" 2>&1
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            echo "::error::assembleRelease unexpectedly succeeded without trusted signing inputs."
            exit 1
          fi
          if ! grep -Fq "Refusing to build an unsigned release APK; configure the existing trusted signing key." "$RUNNER_TEMP/release-signing-guard.log"; then
            cat "$RUNNER_TEMP/release-signing-guard.log"
            echo "::error::assembleRelease failed for a reason other than the expected signing guard."
            exit 1
          fi


      - name: Upload installable V3 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'feature/v3.5-recipe-expansion' && format('aaria-magical-kitchen-v35-review-apk-{0}', github.run_number) || 'aaria-magical-kitchen-v3-apk' }}
          path: |
            phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
            v35-review-build-metadata.txt
            artifacts/v35-android-smoke/
            artifacts/v35-acceptance-report.json
            artifacts/v35-artwork-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload replaceable V3 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3-html
          path: dist/Aaria_Magical_Kitchen_V3.html
          if-no-files-found: warn
          retention-days: 30

  build-integration-apk:
    if: github.ref == 'refs/heads/feature/w01-97-recipe-mainline'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      W01_OWNER_REVIEW_BUILD_SUFFIX: ${{ github.run_number }}
    steps:
      - name: Check out exact pushed commit
