name: Aaria Phase 2 debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/platform-v2
    paths:
      - 'phase2-pilot/**'
      - '.github/workflows/android-pilot.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4

      - name: Check out approved 95-recipe app source
        uses: actions/checkout@v4
        with:
          ref: 95f86ccbfe1222d8b263a6a83810b3c46d793c7e
          path: approved-full-source
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Run pilot checks
        working-directory: phase2-pilot
        run: |
          npm test
          npm run validate:recipes
          npm run validate:artwork
          npm run build:preview
          node --check apps/aaria-kitchen/app.js
          node --check dist/bundle-check.mjs

      - name: Validate and install approved full app in Android shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          source = Path('approved-full-source/index.html').read_text()
          marker = 'const RECIPES='
          start = source.index(marker) + len(marker)
          while source[start].isspace(): start += 1
          stack, in_string, escaped = [], False, False
          for pos in range(start, len(source)):
              char = source[pos]
              if in_string:
                  if escaped: escaped = False
                  elif char == chr(92): escaped = True
                  elif char == '"': in_string = False
                  continue
              if char == '"': in_string = True
              elif char in '[{': stack.append(char)
              elif char in ']}':
                  stack.pop()
                  if not stack:
                      recipes = json.loads(source[start:pos + 1])
                      break
          assert len(recipes) == 95, f'Expected 95 recipes, found {len(recipes)}'
          for feature in ('function shareGroceryList', 'async function shareCook', 'groceryMessage', 'DAYS'):
              assert feature in source, f'Missing feature code: {feature}'
          Path('phase2-pilot/apps/aaria-android/app/src/main/assets').mkdir(parents=True, exist_ok=True)
          Path('phase2-pilot/apps/aaria-android/app/src/main/assets/index.html').write_text(source)
          scripts = re.findall(r'<script\\b[^>]*>(.*?)</script\\s*>', source, re.S | re.I)
          assert len(scripts) >= 2, 'Expected embedded app scripts'
          Path('/tmp/aaria-full-app.js').write_text(scripts[1])
          print(f'Embedded approved source with {len(recipes)} recipes')
          PY
          node --check /tmp/aaria-full-app.js

      - name: Assemble debug APK
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aaria-phase2-pilot-debug-apk
          path: phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload embedded full app source
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-embedded-web-app
          path: phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          if-no-files-found: error
          retention-days: 30
