name: Automatic PWA update migration checks

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "browser-adapters.js"
      - "magical-updates.css"
      - "install-link-gate.css"
      - "aaria-accessibility-text-size.css"
      - "js/**"
      - "tools/v3/qa/fixtures/pwa-previous/**"
      - "tools/v3/qa/pwa-automatic-updates-migration.mjs"
      - "tools/v3/qa/magical-updates-focused.mjs"
      - ".github/workflows/pwa-automatic-updates-migration.yml"

permissions:
  contents: read

jobs:
  update-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated Playwright dependency
        run: npm install --prefix /tmp/aaria-pwa-migration-qa playwright
      - name: Install Chromium
        run: node /tmp/aaria-pwa-migration-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test previous-version migration and automatic updates
        timeout-minutes: 5
        env:
          PLAYWRIGHT_MODULE: /tmp/aaria-pwa-migration-qa/node_modules/playwright
        run: timeout --signal=TERM --kill-after=10s 270s node tools/v3/qa/pwa-automatic-updates-migration.mjs
      - name: Verify Magical Updates and Recipe 112 navigation
        timeout-minutes: 4
        env:
          PLAYWRIGHT_MODULE: /tmp/aaria-pwa-migration-qa/node_modules/playwright
        run: timeout --signal=TERM --kill-after=10s 210s node tools/v3/qa/magical-updates-focused.mjs
