name: Aaria V3.4 Dual Home Preview APK

on:
  push:
    branches:
      - feature/v3.4-dual-home-experience
    paths:
      - .github/workflows/v34-android-preview.yml
      - .github/scripts/v34-dual-home-smoke.mjs
      - tools/v3/v34-dual-home.js
      - tools/v3/attach-v34-dual-home.mjs
      - tools/v3/transform-production.mjs
      - tools/v3/runtime.js
      - tools/v3/home-world-visual.css
      - phase2-pilot/apps/aaria-android/app/src/main/java/com/aaria/magickitchen/pilot/ShareImageProvider.kt
      - phase2-pilot/apps/aaria-android/app/src/main/java/com/aaria/magickitchen/pilot/MainActivity.kt
      - phase2-pilot/apps/aaria-android/app/src/test/java/com/aaria/magickitchen/pilot/CameraCaptureResultTest.kt
  workflow_dispatch:
    inputs:
      owner_visual_approval:
        description: Explicit owner authorization for a V3.4 preview APK build
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: aaria-v34-preview-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.owner_visual_approval == true || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'W01-OWNER-APPROVED-V34-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      V34_PREVIEW_BUILD_SUFFIX: ownerfix2
      ANDROID_TEST_APP_ID: com.aaria.magickitchen.pilot.v34previewownerfix2
    steps:
      - name: Check out exact V3.4 source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and Gradle
        uses: android-actions/setup-android@v4
      - name: Restore the stable V3.4 preview debug signer
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aaria-v34-preview-debug-keystore-ownerfix-v1
      - name: Ensure stable V3.4 preview debug signer exists
        shell: bash
        run: |
          set -euo pipefail
          keystore="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$keystore")"
          if [[ ! -s "$keystore" ]]; then
            keytool -genkeypair -noprompt -v -keystore "$keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$keystore" -storepass android -alias androiddebugkey
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=android"
            echo "ANDROID_KEY_ALIAS=androiddebugkey"
            echo "ANDROID_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Build the approved 97-recipe offline runtime and attach V3.4 APK layer
        run: |
          set -euo pipefail
          node tools/v3/artwork/build-international-review.mjs
          node tools/v3/artwork/batches/batch-01/build-android-review.mjs
          mkdir -p dist artifacts/v34-preview phase2-pilot/apps/aaria-android/app/src/main/assets
          V32_REVIEW_FEATURED_IDS=12 node tools/v3/transform-production.mjs index.html dist/Aaria_V3_4_Base.html
          node tools/v3/attach-v34-dual-home.mjs dist/Aaria_V3_4_Base.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          node tools/v3/validate-v34-preview.mjs phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          node --check tools/v3/v34-dual-home.js
          node --check tools/v3/runtime.js
          node --check .github/scripts/v34-dual-home-smoke.mjs
          test "$(grep -o 'data-v34-style=' tools/v3/v34-dual-home.js | wc -l)" -ge 2
          grep -Fq "getItem(STYLE_KEY) === 'classic' ? 'classic' : 'magical'" tools/v3/v34-dual-home.js
          ! grep -Fq 'class="v31-hero-character"' tools/v3/runtime.js
          ! grep -Fq 'class="v31-hero-dog"' tools/v3/runtime.js
      - name: Run Android unit tests and build isolated V3.4 preview APK
        run: |
          current_version_code=$((8 + GITHUB_RUN_NUMBER))
          export V34_PREVIEW_VERSION_CODE=$((current_version_code - 1))
          gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleDebug
          cp phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk artifacts/v34-preview/Aaria_V3_4_Upgrade_Baseline.apk
          export V34_PREVIEW_VERSION_CODE="$current_version_code"
          echo "V34_PREVIEW_VERSION_CODE=$current_version_code" >> "$GITHUB_ENV"
          gradle --no-daemon -p phase2-pilot/apps/aaria-android testDebugUnitTest assembleDebug
      - name: Record package, signing certificate and APK SHA-256
        run: |
          set -euo pipefail
          apk=phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          baseline=artifacts/v34-preview/Aaria_V3_4_Upgrade_Baseline.apk
          "$aapt" dump badging "$apk" > artifacts/v34-preview/apk-badging.txt
          "$apksigner" verify --print-certs "$apk" > artifacts/v34-preview/apk-signer.txt
          "$aapt" dump badging "$baseline" > artifacts/v34-preview/upgrade-baseline-badging.txt
          "$apksigner" verify --print-certs "$baseline" > artifacts/v34-preview/upgrade-baseline-signer.txt
          grep -Fq "package: name='${ANDROID_TEST_APP_ID}' versionCode='${V34_PREVIEW_VERSION_CODE}' versionName='3.4.$((GITHUB_RUN_NUMBER))'" artifacts/v34-preview/apk-badging.txt
          grep -Fq "application-label:'Aaria Magical Kitchen V3.4 Home Preview'" artifacts/v34-preview/apk-badging.txt
          grep -Fq "package: name='${ANDROID_TEST_APP_ID}' versionCode='$((V34_PREVIEW_VERSION_CODE - 1))' versionName='3.4.$((GITHUB_RUN_NUMBER - 1))'" artifacts/v34-preview/upgrade-baseline-badging.txt
          current_cert="$(grep 'certificate SHA-256 digest:' artifacts/v34-preview/apk-signer.txt)"
          baseline_cert="$(grep 'certificate SHA-256 digest:' artifacts/v34-preview/upgrade-baseline-signer.txt)"
          test -n "$current_cert" && test "$current_cert" = "$baseline_cert"
          echo "$GITHUB_SHA" > artifacts/v34-preview/source-head.txt
          echo "$ANDROID_TEST_APP_ID" > artifacts/v34-preview/package-id.txt
          sha256sum "$apk" | tee artifacts/v34-preview/apk-sha256.txt
          cp "$apk" artifacts/v34-preview/Aaria_V3_4_Dual_Home_Preview.apk
          printf 'signing=V3.4 branch-scoped cached Android debug key\npackage=stable co-installable V3.4 preview ID\npreview_update=stable package, signer and increasing versionCode\nproduction_package_or_signer_upgrade=NOT_CLAIMED\nproduction_release=NOT_AUTHORIZED\n' > artifacts/v34-preview/compatibility.txt
      - name: Upload installable V3.4 preview APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.4-preview-apk
          path: artifacts/v34-preview/**
          if-no-files-found: error
          retention-days: 30

  device-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [phone, tablet]
    env:
      ANDROID_TEST_APP_ID: com.aaria.magickitchen.pilot.v34previewownerfix2
      V34_DEVICE: ${{ matrix.device }}
    steps:
      - name: Check out smoke harness at the exact V3.4 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download exact-head V3.4 APK
        uses: actions/download-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.4-preview-apk
          path: downloaded
      - name: Run focused Android UI and persistence checks on ${{ matrix.device }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device == 'tablet' && 'pixel_tablet' || 'pixel_3a' }}
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          script: |
            cp downloaded/Aaria_V3_4_Dual_Home_Preview.apk app-debug.apk
            node --version
            node .github/scripts/v34-dual-home-smoke.mjs
      - name: Upload genuine ${{ matrix.device }} screenshots and focused results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.4-${{ matrix.device }}-evidence
          path: artifacts/v34-preview/${{ matrix.device }}/
          if-no-files-found: warn
          retention-days: 30
