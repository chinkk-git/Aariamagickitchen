name: W01 B01 to Full APK readiness watch
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check live W01 evidence and readiness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,re
          repo=os.environ["REPO"];token=os.environ["GH_TOKEN"]
          def get(path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+"/"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","User-Agent":"w01-readiness-watch"})
              with urllib.request.urlopen(req,timeout=25) as resp:return json.load(resp)
          branch="codex/w01-unified-v3-v31-20261020"
          sha=get("git/ref/heads/"+branch)["object"]["sha"]
          runs=get("actions/runs?branch="+branch+"&per_page=12")["workflow_runs"]
          exact=[r for r in runs if r["head_sha"]==sha and r["status"]=="completed"]
          ci_pass=bool(exact) and all(r["conclusion"]=="success" for r in exact)
          comments={}
          for n in (5,32,33):
              comments[n]=get("issues/%d/comments?per_page=100"%n)
          combined="\n".join(c.get("body","") for v in comments.values() for c in v[-30:])
          # Fail closed: status notes are evidence pointers, never substitutes for independent approval.
          b01_hold=bool(re.search(r"B01.{0,80}(HOLD|BLOCKED_REVIEW_FINDINGS)|A08.{0,80}changes requested",combined,re.I|re.S))
          rights_unresolved=bool(re.search(r"rights.{0,60}unresolved|reuse rights remain unresolved",combined,re.I))
          result={"w01_head":sha,"exact_head_ci_pass":ci_pass,"b01_review_hold_seen":b01_hold,"rights_unresolved_seen":rights_unresolved,
                  "full_apk_readiness":"NOT_VERIFIED","reason":"Requires independent A08/A09 and rights approval plus real home screen, 95-recipe cooking runtime, signed installable APK and non-destructive emulator evidence; issue comments alone cannot approve."}
          print(json.dumps(result,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## W01 Full APK readiness watch\n\n")
              f.write("| Check | Result |\n|---|---|\n")
              for k,v in result.items():f.write("| "+k+" | "+str(v).replace("|","/")+" |\n")
              f.write("\nNext W01 task: complete B01 remediation and independent review; then audit new home, 95 recipes, runtime integration, build, emulator portrait/landscape, APK SHA-256 and side-by-side install.\n")
          PY
