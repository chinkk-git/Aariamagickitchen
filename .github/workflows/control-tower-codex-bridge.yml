name: Control Tower Codex task lease bridge
on:
  issue_comment:
    types: [created]
permissions:
  actions: write
  issues: write
  contents: read
jobs:
  bridge:
    if: github.event.issue.number == 25 && !github.event.issue.pull_request && github.event.comment.user.login == 'chinkk-git' && startsWith(github.event.comment.body, '/ct25 ')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const body=context.payload.comment.body.trim();
            const m=body.match(/^\/ct25 (claim|release) ([a-zA-Z0-9_-]{8,100})$/);
            if(!m) throw Error('Expected /ct25 claim TOKEN or /ct25 release TOKEN');
            const operation=m[1],lease_token=m[2];
            const {data:file}=await github.rest.repos.getContent({owner,repo,path:'control-tower/tasks.json',ref:'main'});
            const doc=JSON.parse(Buffer.from(file.content,'base64').toString('utf8'));
            const task=doc.tasks.find(x=>x.id==='CT25');
            if(!task||task.owner!=='v3') throw Error('CT25 not registered to v3');
            if(operation==='claim' && task.status!=='READY') throw Error('CT25 not READY');
            await github.rest.actions.createWorkflowDispatch({
              owner,repo,workflow_id:'control-tower-lease.yml',ref:'main',
              inputs:{task_id:'CT25',worker:'v3',operation,lease_token}
            });
            const response='<!-- ct25-bridge -->\nDispatched **'+operation+'** for CT25 to the exclusive lease workflow. This is not proof of a successful claim; check the lease workflow run and tasks.json. Only a genuinely active Codex/Work session may implement the task.';
            await github.rest.issues.createComment({owner,repo,issue_number:25,body:response});
