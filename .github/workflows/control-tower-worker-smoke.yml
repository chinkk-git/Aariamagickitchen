name: Control Tower end-to-end worker smoke test
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: ct-worker-smoke
  cancel-in-progress: false
jobs:
  worker-smoke:
    if: github.event.issue.number == 11 && github.event.label.name == 'ct:worker-smoke' && github.event.issue.user.login == 'chinkk-git'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branch='control-tower/e2e-worker-smoke-20261019';
            const path='control-tower/e2e_worker_smoke.txt';
            const payload='Control Tower deterministic worker smoke fixture. No AI coding worker was invoked.\n';
            const main=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            try { await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branch,sha:main.data.commit.sha}); }
            catch(e) { if(e.status!==422) throw e; }
            let sha;
            try { const file=await github.rest.repos.getContent({owner,repo,path,ref:branch});sha=file.data.sha; }
            catch(e) { if(e.status!==404) throw e; }
            const result=await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch,sha,message:'test: automated worker creates isolated PR fixture',
              content:Buffer.from(payload).toString('base64')
            });
            const existing=await github.rest.pulls.list({owner,repo,state:'open',head:owner+':'+branch});
            const pr=existing.data[0] || (await github.rest.pulls.create({
              owner,repo,head:branch,base:'main',draft:true,
              title:'test: deterministic GitHub worker handoff (NOT AI)',
              body:'Isolated end-to-end test: issue label -> GitHub Actions worker -> code commit -> draft PR -> deterministic CI. This is NOT an AI coding worker and does NOT validate autonomous AI coding. No app code modified.'
            })).data;
            const body='<!-- ct-worker-smoke -->\nGitHub-native **deterministic** worker created commit '+result.data.commit.sha+' and draft PR '+pr.html_url+'. Await CI. **No AI worker used; AI handoff remains unverified.**';
            await github.rest.issues.createComment({owner,repo,issue_number:11,body});
            core.summary.addRaw(body).write();
