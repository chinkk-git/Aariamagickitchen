name: Control Tower guarded transaction (DISABLED)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [claim, renew, release, recover]
        required: true
      task_id:
        type: string
        required: true
      worker:
        type: choice
        options: [W01, W02, W03, W04]
        required: true
permissions:
  contents: read
jobs:
  guarded-transaction:
    if: ${{ false }}
    environment: worker-control-runtime
    permissions:
      contents: write
    concurrency:
      group: control-tower-worker-registry
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Execute protected transaction runtime
        env:
          CT_TRANSACTION_ENABLED: "0"
          CT_ACTOR_WORKER_MAP: ${{ secrets.CT_ACTOR_WORKER_MAP }}
          GH_TOKEN: ${{ github.token }}
          CT_TASK_ID: ${{ inputs.task_id }}
          CT_WORKER: ${{ inputs.worker }}
          CT_OPERATION: ${{ inputs.operation }}
        run: python3 control-tower/worker_runtime.py
