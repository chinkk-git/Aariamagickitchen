name: My Magical Kitchen V3 signed Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aaria-v3-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    environment: android-production-signing
    env:
      EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
    steps:
      - name: Check out reviewed V3 source
        uses: actions/checkout@v4
        with:
          # Immutable V3 build snapshot; do not replace with a mutable branch.
          ref: 6116d9b6709efd51a1172c335a17940c616ea151

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build and validate V3 HTML from the approved V2 baseline
        run: |
          set -euo pipefail
          node --check tools/v3/transform-production.mjs
          node tools/v3/transform-production.mjs index.html dist/Aaria_Magical_Kitchen_V3.html
          node tools/v3/validate-v3.mjs dist/Aaria_Magical_Kitchen_V3.html
          node tools/v3/test-profile-isolation.mjs
          mkdir -p phase2-pilot/apps/aaria-android/app/src/main/assets
          cp dist/Aaria_Magical_Kitchen_V3.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          grep -Fq 'AARIA_V3_BUILD_2026_10' phase2-pilot/apps/aaria-android/app/src/main/assets/index.html

      - name: Validate signing inputs and stage keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD EXPECTED_SIGNER_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required protected signing input is missing: $name"
              exit 1
            fi
          done
          expected="${EXPECTED_SIGNER_SHA256//:/}"
          expected="${expected,,}"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ANDROID_SIGNER_SHA256 must be a SHA-256 certificate fingerprint."
            exit 1
          fi
          key_file="$RUNNER_TEMP/aaria-production-signing-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          if [[ ! -s "$key_file" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          chmod 600 "$key_file"
          echo "ANDROID_KEYSTORE_PATH=$key_file" >> "$GITHUB_ENV"

      - name: Validate staged signing certificate fingerprint
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          actual="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          expected="${EXPECTED_SIGNER_SHA256//:/}"
          expected="${expected^^}"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Staged keystore certificate fingerprint mismatch. Expected $expected; found $actual."
            exit 1
          fi
          echo "Staged keystore certificate fingerprint validated: $actual"

      - name: Run Android unit tests
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android testDebugUnitTest

      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleRelease

      - name: Verify generated V3 page is packaged
        shell: bash
        run: |
          set -euo pipefail
          apk="phase2-pilot/apps/aaria-android/app/build/outputs/apk/release/app-release.apk"
          entry="assets/index.html"
          if ! unzip -Z1 "$apk" | grep -Fxq "$entry"; then
            echo "::error::Generated V3 index.html is missing from the APK."
            exit 1
          fi
          packaged_bytes="$(unzip -p "$apk" "$entry" | wc -c)"
          if [[ "$packaged_bytes" -lt 1000000 ]]; then
            echo "::error::Packaged index.html is unexpectedly small: $packaged_bytes bytes."
            exit 1
          fi
          if ! unzip -p "$apk" "$entry" | grep -Fq "AARIA_V3_BUILD_2026_10"; then
            echo "::error::APK contains the baseline page without the generated V3 layer."
            exit 1
          fi

      - name: Verify APK signature and trusted certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="phase2-pilot/apps/aaria-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          actual="$(printf '%s\n' "$cert_output" | sed -nE 's/^[[:space:]]*(Signer #1 certificate SHA-256 digest:|V[0-9]+ Signer: certificate SHA-256 digest:) *//p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected="${EXPECTED_SIGNER_SHA256//:/}"
          expected="${expected,,}"
          if [[ -z "$actual" ]]; then
            details="$(printf '%s\n' "$cert_output" | grep -E 'Signer #1|SHA-256 digest' | tr '\n' ';' || true)"
            echo "::error::Could not extract APK signer certificate fingerprint from apksigner output. $details"
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::APK signer does not match the trusted certificate fingerprint. Expected $expected; found $actual."
            exit 1
          fi

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: my-magical-kitchen-v3-signed-apk
          path: phase2-pilot/apps/aaria-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/aaria-production-signing-key.jks"
