name: My Magical Kitchen V3 signed Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aaria-v3-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    environment: android-production-signing
    env:
      EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
    steps:
      - name: Check out reviewed V3 source
        uses: actions/checkout@v4
        with:
          # Immutable V3 build snapshot; do not replace with a mutable branch.
          ref: 32c5398bba5d55502b2499dd32ae0af69cc6f48b

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Validate signing inputs and stage keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD EXPECTED_SIGNER_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required protected signing input is missing: $name"
              exit 1
            fi
          done
          expected="${EXPECTED_SIGNER_SHA256//:/}"
          expected="${expected,,}"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ANDROID_SIGNER_SHA256 must be a SHA-256 certificate fingerprint."
            exit 1
          fi
          key_file="$RUNNER_TEMP/aaria-production-signing-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          if [[ ! -s "$key_file" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          chmod 600 "$key_file"
          echo "ANDROID_KEYSTORE_PATH=$key_file" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleRelease

      - name: Verify APK signature and trusted certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="phase2-pilot/apps/aaria-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          actual="$("$apksigner" verify --print-certs "$apk" | awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="${EXPECTED_SIGNER_SHA256//:/}"
          expected="${expected,,}"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::APK signer does not match the trusted certificate fingerprint."
            exit 1
          fi

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: my-magical-kitchen-v3-signed-apk
          path: phase2-pilot/apps/aaria-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/aaria-production-signing-key.jks"
