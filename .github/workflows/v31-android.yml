name: Aaria V3.1 Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v3.1-home-redesign
    paths:
      - 'index.html'
      - 'tools/v3/**'
      - 'phase2-pilot/**'
      - 'content/**'
      - 'docs/**'
      - '.github/scripts/**'
      - '.github/workflows/v31-android.yml'

permissions:
  contents: read

concurrency:
  group: aaria-v31-android-preview
  cancel-in-progress: false

jobs:
  build-v31-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated V3.1 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Run repository regression and V3.1 data gates
        working-directory: phase2-pilot
        run: |
          npm test
          npm run validate:recipes
          npm run validate:v31

      - name: Build offline V3.1 HTML and validate all original recipes
        run: |
          set -euo pipefail
          node --check tools/v3/transform-production.mjs
          node --check tools/v3/runtime.js
          node tools/v3/transform-production.mjs index.html dist/Aaria_Magical_Kitchen_V3_1.html
          node tools/v3/validate-v3.mjs dist/Aaria_Magical_Kitchen_V3_1.html
          node tools/v3/test-approved-chef-art.mjs dist/Aaria_Magical_Kitchen_V3_1.html
          node tools/v3/test-csp-policy.mjs
          node tools/v3/test-profile-isolation.mjs
          node tools/v3/validate-v31.mjs
          mkdir -p phase2-pilot/apps/aaria-android/app/src/main/assets
          cp dist/Aaria_Magical_Kitchen_V3_1.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          grep -Fq 'AARIA_V3_BUILD_2026_10' phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          grep -Fq 'World Food Adventures' phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          sha256sum dist/Aaria_Magical_Kitchen_V3_1.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html

      - name: Run Android unit tests
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android testDebugUnitTest

      - name: Assemble installable Android preview APK
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleDebug

      - name: Verify packaged offline V3.1 experience
        run: |
          set -euo pipefail
          apk=phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$apk" | grep -Fxq 'assets/index.html'
          unzip -p "$apk" assets/index.html | grep -Fq 'World Food Adventures'
          unzip -p "$apk" assets/index.html | grep -Fq 'ne_110m_admin_0_countries'

      - name: Launch Android APK and capture home/map screenshots
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: bash .github/scripts/v31-android-smoke.sh
      - name: Upload installable V3.1 preview APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.1-preview-apk
          path: phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload offline V3.1 HTML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.1-html
          path: dist/Aaria_Magical_Kitchen_V3_1.html
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.1-android-screenshots
          path: artifacts/v31-android-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.1-android-diagnostics
          path: artifacts/v31-diagnostics/**
          if-no-files-found: warn
          retention-days: 30
