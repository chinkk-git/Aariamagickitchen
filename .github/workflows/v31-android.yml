name: Aaria V3.1 Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v3.1-home-redesign
      - codex/w01-unified-v3-v31-20261020
    paths:
      - 'index.html'
      - 'tools/v3/**'
      - 'phase2-pilot/**'
      - 'content/**'
      - 'docs/**'
      - '.github/scripts/**'
      - '.github/workflows/v31-android.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: aaria-v31-android-preview
  cancel-in-progress: false

jobs:
  build-v31-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated V3.1 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Record exact source HEAD
        run: |
          mkdir -p artifacts/v31-diagnostics
          echo "${GITHUB_SHA}" | tee artifacts/v31-diagnostics/source-head.txt
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run repository regression and V3.1 data gates
        working-directory: phase2-pilot
        run: |
          npm test
          npm run validate:recipes
          npm run validate:v31

      - name: Build offline V3.1 HTML and validate all original recipes
        run: |
          set -euo pipefail
          node --check tools/v3/transform-production.mjs
          node --check tools/v3/runtime.js
          node tools/v3/transform-production.mjs index.html dist/Aaria_Magical_Kitchen_V3_1.html
          node tools/v3/validate-v3.mjs dist/Aaria_Magical_Kitchen_V3_1.html
          node tools/v3/test-approved-chef-art.mjs dist/Aaria_Magical_Kitchen_V3_1.html
          node tools/v3/test-csp-policy.mjs
          node tools/v3/test-profile-isolation.mjs
          node tools/v3/test-photo-share-approval.mjs
          node tools/v3/test-secure-content-update-approval.mjs
          node tools/v3/validate-v31.mjs
          mkdir -p phase2-pilot/apps/aaria-android/app/src/main/assets
          cp dist/Aaria_Magical_Kitchen_V3_1.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          grep -Fq 'AARIA_V3_BUILD_2026_10' phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          grep -Fq 'World Food Adventures' phase2-pilot/apps/aaria-android/app/src/main/assets/index.html
          sha256sum dist/Aaria_Magical_Kitchen_V3_1.html phase2-pilot/apps/aaria-android/app/src/main/assets/index.html

      - name: Run Android unit tests
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android testDebugUnitTest

      - name: Assemble installable Android preview APK
        run: gradle --no-daemon -p phase2-pilot/apps/aaria-android assembleDebug

      - name: Verify packaged offline V3.1 experience
        run: |
          set -euo pipefail
          apk=phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$apk" | grep -Fxq 'assets/index.html'
          unzip -p "$apk" assets/index.html | grep -Fq 'World Food Adventures'
          unzip -p "$apk" assets/index.html | grep -Fq 'ne_110m_admin_0_countries'

      - name: Prepare Linux KVM access for x86_64 emulator
        run: |
          set -euo pipefail
          mkdir -p artifacts/v31-diagnostics
          if [ ! -e /dev/kvm ]; then
            printf 'kvm_preflight=failed\nreason=/dev/kvm is not present on this runner\n' > artifacts/v31-diagnostics/kvm-preflight.txt
            cat artifacts/v31-diagnostics/kvm-preflight.txt
            exit 1
          fi
          sudo chown "$(id -un)" /dev/kvm
          sudo chmod 600 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            printf 'kvm_preflight=failed\nreason=runner cannot read and write /dev/kvm after permission setup\n' > artifacts/v31-diagnostics/kvm-preflight.txt
            cat artifacts/v31-diagnostics/kvm-preflight.txt
            exit 1
          fi
          printf 'kvm_preflight=passed\nrunner=%s\n' "$(id -un)" > artifacts/v31-diagnostics/kvm-preflight.txt
          stat -c 'device=%n owner=%U group=%G mode=%a' /dev/kvm | tee -a artifacts/v31-diagnostics/kvm-preflight.txt
      - name: Download original V3 APK for co-install verification
        uses: actions/download-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.1-preview-apk
          path: artifacts/v31-baseline-apk
          repository: chinkk-git/Aariamagickitchen
          run-id: 39191099617
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Launch Android APK and capture home/map screenshots
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 4
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash .github/scripts/v31-android-smoke.sh
      - name: Record APK payload checksum and exact HEAD
        if: always()
        run: |
          mkdir -p artifacts/v31-diagnostics
          echo "${GITHUB_SHA}" > artifacts/v31-diagnostics/source-head.txt
          if [ -f phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk ]; then
            sha256sum phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk > artifacts/v31-diagnostics/apk-sha256.txt
          fi

      - name: Upload installable V3.1 preview APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.1-preview-apk
          path: phase2-pilot/apps/aaria-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload offline V3.1 HTML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.1-html
          path: dist/Aaria_Magical_Kitchen_V3_1.html
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.1-android-screenshots
          path: artifacts/v31-android-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-magical-kitchen-v3.1-android-diagnostics
          path: artifacts/v31-diagnostics/**
          if-no-files-found: warn
          retention-days: 30
