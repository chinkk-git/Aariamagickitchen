name: Control Tower deterministic gates
on:
  push:
    paths:
      - 'control-tower/**'
      - '.github/workflows/control-tower-gates.yml'
  pull_request:
    paths:
      - 'control-tower/**'
      - '.github/workflows/control-tower-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-tower-gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate task and release manifest
        run: |
          python3 control-tower/validate.py
          python3 control-tower/test_orchestration.py
          python3 control-tower/test_release_gates.py
          python3 control-tower/worker_registry.py
          python3 control-tower/test_worker_registry.py
          python3 control-tower/test_worker_scheduler.py
          python3 control-tower/test_worker_leases.py
          python3 control-tower/test_worker_release.py
          python3 control-tower/test_worker_claims.py
          python3 control-tower/test_worker_github_cas.py
          python3 control-tower/test_worker_reviewer_identity.py
          python3 control-tower/test_worker_github_reviews.py
          python3 control-tower/test_worker_transactions.py
          python3 control-tower/test_worker_executor.py
          python3 control-tower/test_worker_runtime.py
          python3 control-tower/test_worker_security_evidence.py
          python3 control-tower/test_worker_shared_lease_policy.py
          python3 control-tower/test_worker_atomic_lease.py
          python3 control-tower/test_worker_atomic_cas_adapter.py
          python3 control-tower/test_worker_execution_boundary.py
      - name: Publish summary
        if: always()
        run: |
          echo '## Control Tower manifest validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validation is deterministic. It does not prove Work session liveness, visual approval, child-safety review or physical-device signing.' >> "$GITHUB_STEP_SUMMARY"
