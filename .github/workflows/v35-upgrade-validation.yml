name: V3.5 same-origin upgrade validation

on:
  push:
    branches:
      - release/v3.5-html-recovery-20261030

permissions:
  contents: read

concurrency:
  group: v35-upgrade-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-upgrade:
    name: Chromium and WebKit upgrade harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install isolated Playwright dependency
        run: npm install --prefix /tmp/aaria-v35-qa playwright

      - name: Install Chromium, WebKit and system dependencies
        run: node /tmp/aaria-v35-qa/node_modules/playwright/cli.js install --with-deps chromium webkit

      - name: Run same-origin production-to-V3.5 validation
        env:
          NODE_PATH: /tmp/aaria-v35-qa/node_modules
          AARIA_CANDIDATE_ROOT: ${{ github.workspace }}
          AARIA_QA_REPORT: /tmp/aaria-v35-upgrade-report.json
        run: node tools/v3/qa/v35-upgrade-validation.mjs

      - name: Upload report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-v35-upgrade-${{ github.sha }}
          path: |
            /tmp/aaria-v35-upgrade-report.json
            /tmp/aaria-v35-*.png
          if-no-files-found: warn
          retention-days: 7
