name = "aaria-magical-notifications"
main = "src/index.js"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]

[vars]
PARENT_CONSENT_MODEL_APPROVED = "false"

[[d1_databases]]
binding = "DB"
database_name = "aaria-notifications"
database_id = "a6e15229-e5e9-496f-be51-9697f556c095"
migrations_dir = "migrations"

[[queues.producers]]
binding = "DELIVERY_QUEUE"
queue = "aaria-notification-delivery"

[[queues.consumers]]
queue = "aaria-notification-delivery"
max_batch_size = 20
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "aaria-notification-dead-letter"
max_concurrency = 1

[[queues.consumers]]
queue = "aaria-notification-dead-letter"
max_batch_size = 20
max_batch_timeout = 5
max_retries = 100

[triggers]
crons = ["15 * * * *"]
