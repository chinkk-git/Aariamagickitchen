<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<title>Wave 1 Recipe Template Review</title><style>
:root{--ink:#39234f;--cream:#fff8f7;--purple:#6844a0;--shadow:#54368b12;font:16px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--cream)}*{box-sizing:border-box}body{margin:0;background:var(--cream)}
__APPROVED_RECIPE_CSS__
.review-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;background:#fff;border-bottom:1px solid #eaddec}.review-bar button,.review-bar select{min-height:38px;padding:7px 12px;border:1px solid #eaddec;border-radius:99px;background:#fff;color:#6844a0;font:inherit;font-size:13px;font-weight:800}.review-bar button[aria-pressed=true]{background:#f0e3f7;border-color:#6844a0}.review-bar .review-status{margin-left:auto;color:#76527c;font-size:11px;font-weight:800}.review-shell{min-height:100dvh;padding:8px 10px}.v32-r12-main{margin:0 auto!important;padding:8px 10px 24px!important}.v32-r12-step-visual{margin:0}.v32-r12-step-visual img{display:block;width:min(100%,520px);max-height:54vh;object-fit:contain;margin:auto;border-radius:16px}.v32-r12-ingredient-art img,.v32-r12-equipment-list img{display:block;width:40px;height:40px;object-fit:contain}.v32-r12-ingredients .ref-ingredient input{position:absolute;opacity:0;width:1px;height:1px}.v32-r12-completion{color:var(--ink)}.v32-r12-recipe-safety{margin:0}
</style></head><body>
<nav class="review-bar" aria-label="Recipe and language"><button id="r96" aria-pressed="true">Italy · #096</button><button id="r99" aria-pressed="false">China · #099</button><label>Language <select id="locale"><option value="en-GB">English (UK)</option><option value="pt-BR">Português (Brasil)</option></select></label><span class="review-status">Debug-only · Offline · Not released · Source __SOURCE_COMMIT_SHORT__</span></nav>
<div id="app" class="app reference-active v32-recipe12-pilot-active"><main id="screen" class="page review-shell" aria-live="polite"></main></div>
<script>
const packageData=__RECIPE_DATA__;let recipeIndex=0,locale='en-GB',stepIndex=0,completed=false;
const app=document.querySelector('#screen'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=x=>typeof x==='object'&&x?x[locale]:x;const image=x=>esc(x?.path||x||'');
const labels=()=>locale==='pt-BR'?{step:'ETAPA',of:'DE',previous:'← Anterior',next:'Próxima etapa →',finish:'Concluir →',complete:'RECEITA CONCLUÍDA',dish:'Prato pronto',adult:'Ajuda de adulto',safety:'Segurança'}:{step:'STEP',of:'OF',previous:'← Previous',next:'Next step →',finish:'Finish →',complete:'RECIPE COMPLETE',dish:'Finished dish',adult:'Adult help',safety:'Safety'};
function render(){const r=packageData[recipeIndex].locales[locale],step=r.steps[stepIndex],ui=labels(),title=text(r.title),steps=r.steps;
const ingredients=r.ingredients.map((x,i)=>'<label class="ref-ingredient"><span class="v32-r12-ingredient-art"><img class="v3-ingredient-art" src="'+image(x.image)+'" alt=""></span><span class="v32-r12-ingredient-name">'+esc(text(x.name))+' · '+esc(x.quantity)+' '+esc(x.unit)+'</span><input type="checkbox" aria-label="'+esc(text(x.name))+'"><i aria-hidden="true">○</i></label>').join('');
const equipment=r.equipmentItems.map(x=>'<li><span><img src="'+image(x.image)+'" alt=""></span><small>'+esc(text(x.name))+'<br>'+esc(x.roleDescription||x.role)+'</small></li>').join('');
const stepPanel=completed?'<section class="v32-r12-completion" data-v32-recipe-completion role="status" aria-live="polite"><p class="v32-r12-eyebrow">'+ui.complete+'</p><h2>'+esc(title)+'</h2><p>'+esc(text(step.safety))+'</p></section>':'<section class="v32-r12-cook" aria-label="'+(locale==='pt-BR'?'Etapas da receita':'Recipe steps')+'"><div class="v32-r12-progress-head"><p class="v32-r12-eyebrow">'+ui.step+' '+(stepIndex+1)+' '+ui.of+' '+steps.length+'</p><span class="v32-r12-step-count">'+(stepIndex+1)+' / '+steps.length+'</span></div><div class="v32-r12-progress" role="progressbar" aria-valuemin="1" aria-valuemax="'+steps.length+'" aria-valuenow="'+(stepIndex+1)+'">'+steps.map((_,i)=>'<span class="'+(i<=stepIndex?'is-complete':'')+'"></span>').join('')+'</div><div class="ref-step-grid v32-r12-step-grid" data-step-count="'+steps.length+'"><article class="ref-step-card active v32-r12-step-card" data-step-index="'+(stepIndex+1)+'"><div class="v32-r12-step-heading"><span class="v32-r12-method-icon" aria-hidden="true">✨</span><div><p class="v32-r12-step-kicker">'+ui.step+' '+(stepIndex+1)+'</p><h2 class="ref-step-title v32-r12-title"><span class="ref-step-number">'+(stepIndex+1)+'</span><strong>'+esc(text(step.title))+'</strong></h2></div></div><figure class="v32-r12-step-visual"><img class="ref-step-photo new-recipe-step" src="'+image(step.image)+'" alt="'+esc(text(step.title))+'"></figure><div class="ref-step-copy v32-r12-instruction"><p data-original-source="recipe-step">'+esc(text(step.instruction))+'</p></div><aside class="v32-r12-safety" role="note"><span class="v32-r12-safety-icon" aria-hidden="true">!</span><div><strong>'+ui.safety+' · '+ui.adult+'</strong><p data-original-source="recipe-safety">'+esc(text(step.safety))+' '+esc(text(step.adultAssist))+'</p></div></aside></article></div><div class="v32-r12-step-actions v32-r12-actions"><button type="button" class="ref-back" id="prev" '+(stepIndex===0?'disabled':'')+'>'+ui.previous+'</button><span class="v32-r12-actions-progress">'+(stepIndex+1)+' '+ui.of+' '+steps.length+'</span><button type="button" class="ref-next" id="next">'+(stepIndex===steps.length-1?ui.finish:ui.next)+'</button></div></section>';
app.innerHTML='<main class="v32-r12-main" data-v32-template="recipe-step-v1" data-recipe-id="'+r.id+'"><header class="v32-r12-header"><p class="v32-r12-special"><span>INTERNATIONAL RECIPE · REVIEW ONLY</span><span>#'+String(r.id).padStart(3,'0')+'</span></p><div class="v32-r12-title-block"><p class="v32-r12-eyebrow">'+esc(r.country)+' · '+(locale==='pt-BR'?'RECEITA INTERNACIONAL':'INTERNATIONAL RECIPE')+'</p><h1>'+esc(title)+'</h1><p>'+esc(text(r.description))+'</p></div><div class="v32-r12-meta"><span class="v32-r12-method">🍳 '+esc(r.method||'Cooking')+'</span><span>◷ '+esc(r.estimatedHandsOnMinutes)+' min</span></div><p class="v32-r12-yield">'+esc(r.servings)+' '+(locale==='pt-BR'?'porções':'servings')+'</p><p class="v32-r12-pending">Nutrition estimate · independent review pending</p></header><figure class="v32-r12-dish-photo"><img src="'+image(r.finishedDish)+'" alt="'+ui.dish+': '+esc(title)+'"></figure><section class="v32-r12-ingredients ref-card"><div class="v32-r12-section-heading"><h2>🥣 '+(locale==='pt-BR'?'Ingredientes':'Ingredients')+'</h2><span>'+esc(r.servings)+' '+(locale==='pt-BR'?'porções':'servings')+'</span></div><div class="v32-r12-ingredient-list">'+ingredients+'</div></section><section class="v32-r12-equipment ref-card"><div class="v32-r12-section-heading"><h2>💗 '+(locale==='pt-BR'?'Você vai precisar':'You’ll need')+'</h2></div><ul class="v32-r12-equipment-list">'+equipment+'</ul></section>'+stepPanel+'<details open class="storybook-safety v32-r12-recipe-safety"><summary>🛡️ '+(locale==='pt-BR'?'Segurança na cozinha':'Kitchen safety')+' · Allergens</summary><p>'+esc((r.allergens||[]).join(', ')||'None listed')+'. '+esc(text(r.crossContact))+' '+esc(text(r.adultHelp))+'</p></details></main>';
if(!completed){document.querySelector('#prev').onclick=()=>{stepIndex=Math.max(0,stepIndex-1);render()};document.querySelector('#next').onclick=()=>{if(stepIndex<steps.length-1)stepIndex++;else completed=true;render()}}
}
function select(i){recipeIndex=i;stepIndex=0;completed=false;document.querySelector('#r96').setAttribute('aria-pressed',String(i===0));document.querySelector('#r99').setAttribute('aria-pressed',String(i===1));render()}
document.querySelector('#r96').onclick=()=>select(0);document.querySelector('#r99').onclick=()=>select(1);document.querySelector('#locale').onchange=e=>{locale=e.target.value;render()};render();
</script></body></html>
